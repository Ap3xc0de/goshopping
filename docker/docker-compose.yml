services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goshopping
      POSTGRES_PASSWORD: localdev123
      POSTGRES_DB: goshopping
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goshopping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"
      - "9325:9325"
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf

  localstack:
    image: localstack/localstack:latest
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,secretsmanager,ssm
      - DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init/ready.d

  ai-engine:
    build:
      context: ../apps/ai-engine
      dockerfile: Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=development
      - PORT=3002
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret}
      - STORES_PATH=/data/stores
      - STOREFRONT_BASE_URL=${STOREFRONT_BASE_URL:-http://localhost:3004}
      - STOREFRONT_PUBLIC_URL=${STOREFRONT_PUBLIC_URL:-https://goshopping.co}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3003,http://localhost:3004}
    volumes:
      - store_data:/data/stores
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  localstack_data:
  store_data:
