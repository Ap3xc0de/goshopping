name: Test AWS OIDC

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug OIDC token claims
        run: |
          TOKEN_RESPONSE=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          ID_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.value')
          export ID_TOKEN

          python3 - <<'PY'
          import base64
          import json
          import os

          token = os.environ["ID_TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * ((4 - len(payload) % 4) % 4)
          decoded = base64.urlsafe_b64decode(payload.encode("utf-8")).decode("utf-8")
          data = json.loads(decoded)

          keys = ["iss", "aud", "sub", "repository", "ref", "workflow", "job_workflow_ref"]
          print("OIDC claims:")
          for k in keys:
              print(f"{k}: {data.get(k)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Test AWS identity
        run: aws sts get-caller-identity
