name: Deploy Core API

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
    paths:
      - 'apps/core/**'
      - '.github/workflows/core.yml'

permissions:
  id-token: write
  contents: read

env:
  # Pattern: goshopping-{env}-core (matches infra/modules/ecr)
  ECR_REPO: goshopping-${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}-core
  ECS_SERVICE: goshopping-core
  ECS_CLUSTER: goshopping-${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Build & Deploy Core (${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }})
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          # Prefer per-env role secrets; fall back to AWS_ROLE_ARN for backward compat
          role-to-assume: ${{ github.ref == 'refs/heads/main' && (secrets.AWS_ROLE_ARN_PRODUCTION || secrets.AWS_ROLE_ARN) || (secrets.AWS_ROLE_ARN_STAGING || secrets.AWS_ROLE_ARN) }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Build, tag and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPO:latest \
                       apps/core
          docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPO:latest
          echo "image=$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG" >> $GITHUB_OUTPUT
        id: build

      - name: Force ECS service redeployment
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION
