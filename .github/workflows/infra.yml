name: Terraform

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'infra/**'

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: '1.6.6'

jobs:
  terraform:
    name: Terraform ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    defaults:
      run:
        working-directory: infra/environments/${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Import pre-existing AWS resources (idempotent)
        run: |
          set -e
          OIDC_ARN=$(aws iam list-open-id-connect-providers --query 'OpenIDConnectProviderList[0].Arn' --output text)
          import_if_missing() {
            addr="$1"
            id="$2"
            if terraform state list | grep -qF -- "$addr"; then
              echo "$addr already in state, skipping"
            else
              terraform import -var="db_password=${{ secrets.DB_PASSWORD }}" -var="jwt_signing_key=${{ secrets.JWT_SIGNING_KEY }}" "$addr" "$id" || true
            fi
          }
          import_if_missing module.s3.aws_s3_bucket.terraform_state goshopping-terraform-state
          import_if_missing module.s3.aws_dynamodb_table.terraform_locks goshopping-terraform-locks
          if [ -n "$OIDC_ARN" ] && [ "$OIDC_ARN" != "None" ]; then
            import_if_missing module.oidc.aws_iam_openid_connect_provider.github "$OIDC_ARN"
          fi

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="jwt_signing_key=${{ secrets.JWT_SIGNING_KEY }}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve tfplan
