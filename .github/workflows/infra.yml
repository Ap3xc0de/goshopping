name: Terraform

on:
  workflow_dispatch:
  push:
    branches: [main, staging]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'infra/**'

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: '1.6.6'

jobs:
  plan:
    name: Terraform Plan (${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }})
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    defaults:
      run:
        working-directory: infra/environments/${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && (secrets.AWS_ROLE_ARN_PRODUCTION || secrets.AWS_ROLE_ARN) || (secrets.AWS_ROLE_ARN_STAGING || secrets.AWS_ROLE_ARN) }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="jwt_signing_key=${{ secrets.JWT_SIGNING_KEY }}"

  # Staging auto-applies on push. Production uses GitHub Environment "production" —
  # configure required reviewers / wait timer there so apply is not silent.
  apply:
    name: Terraform Apply (${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }})
    needs: plan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    defaults:
      run:
        working-directory: infra/environments/${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ github.ref == 'refs/heads/main' && (secrets.AWS_ROLE_ARN_PRODUCTION || secrets.AWS_ROLE_ARN) || (secrets.AWS_ROLE_ARN_STAGING || secrets.AWS_ROLE_ARN) }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -var="jwt_signing_key=${{ secrets.JWT_SIGNING_KEY }}"
